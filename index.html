<style>
    /* ... (CSS Geral - manter como está, exceto container) ... */
    
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        padding: 0;
        background-color: #f4f4f9;
    }
    .container {
        /* Reduzir a largura máxima para se adequar melhor ao PDF antes da otimização */
        max-width: 900px; /* Redução para 900px */
        margin: 0 auto;
        background-color: #fff;
        padding: 25px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-radius: 8px;
    }
    /* ... (Resto do CSS Geral) ... */

    /* A SEÇÃO MAIS IMPORTANTE: MEDIA PRINT */
    @media print {
        /* 1. Resetar margens do corpo para maximizar o espaço */
        body {
            margin: 0;
            padding: 0;
            background-color: #fff; /* Fundo branco para impressão */
        }
        
        /* 2. Garantir que o container use 100% do espaço da página */
        .container {
            max-width: 100%; /* Usar toda a largura disponível */
            width: 100%;
            margin: 0;
            padding: 20px; /* Adicionar um padding leve para margem */
            box-shadow: none; /* Remover sombra */
        }

        /* 3. Forçar as colunas a ocuparem 48% e evitar quebras indesejadas */
        .columns-container {
            display: flex;
            justify-content: space-between;
            gap: 10px; /* Reduzir o gap para ter mais espaço */
        }
        
        .column {
            flex: 0 0 49%; /* Aumentar ligeiramente para evitar quebras */
            padding: 10px; /* Reduzir padding interno da coluna */
            box-sizing: border-box; /* Essencial para incluir padding na largura */
            /* Se as colunas continuarem a quebrar, defina a largura para 100% e empilhe-as */
            /* flex: 0 0 100%; */
        }

        /* 4. Ocultar botões */
        .button-container {
            display: none;
        }

        /* 5. Mostrar Autenticação e Inputs escondidos */
        .auth-info input, .auth-info input[type="date"] {
             display: none;
        }
        .auth-info span {
            display: block;
            font-weight: normal;
        }
        .auth-info .input-group {
            flex-grow: 1;
            text-align: center;
        }
    }
</style>
